name: maven-actions
on: push
jobs:
  confirm_build_passes:
    runs-on: ubuntu-latest
    steps:
       - name: Perform Java build on Linux
         run: |
           sudo apt-get install -y openjdk-8-jdk maven
           pwd
           ls -Ato
           ls /home/runner/work/speak-to-me-license/ && mvn package

