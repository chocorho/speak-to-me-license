name: maven-actions
on: push
jobs:
  confirm_build_passes:
    runs-on: ubuntu-latest
    steps:
       - name: Perform Java build on Linux
         run: |
           sudo apt-get install -y openjdk-8-jdk maven
           ls -Ato /
           ls -Ato /home
           ls -Ato /home/runner
           ls -Ato /home/runner/work
           find -name java
           cd java && mvn package

